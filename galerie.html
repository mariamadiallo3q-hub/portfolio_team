<!-- GALLERIE MASONRY -->
<div class="gallery">
    <img src="images/img1.jpg" class="image-item portrait" alt="">
    <img src="images/img2.jpg" class="image-item nature" alt="">
    <img src="images/img4.JPG" class="image-item portrait" alt="">
    <img src="images/img5.JPG" class="image-item nature" alt="" width="250" height="350">
    <img src="images/img6.jpg" class="image-item portrait" alt="" width="200" height="300">
     <img src="images/img7.JPG" class="image-item portrait" alt="">
      <img src="images/img8.JPG" class="image-item portrait" alt="">
       <img src="images/img9.JPG" class="image-item portrait" alt="" height="300">
        
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img">
    <div class="nav">
        <span onclick="changeImage(-1)">&#10094;</span>
        <span onclick="changeImage(1)">&#10095;</span>
    </div>
</div>

<script>
const images = document.querySelectorAll('.image-item');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

let currentIndex = 0;


images.forEach((img, index) => {
    img.addEventListener('click', () => {
        currentIndex = index;
        openLightbox();
    });
});

function openLightbox() {
    lightbox.style.display = "flex";
    showImage();
}


function showImage() {
    lightboxImg.src = images[currentIndex].src;
}

/* FERMER */
function closeLightbox() {
    lightbox.style.display = "none";
}

/* IMAGE SUIVANTE / PRECEDENTE */
function changeImage(step) {
    currentIndex += step;

    if (currentIndex < 0) {
        currentIndex = images.length - 1; // boucle arrière
    }

    if (currentIndex >= images.length) {
        currentIndex = 0; // boucle avant
    }

    showImage();
}

/* fermer en cliquant hors image */
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
        closeLightbox();
    }
});
</script>
<hr>

<script>
